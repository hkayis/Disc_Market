services:
  mysql:
    image: mysql:8.0
    container_name: ctis256project-mysql
    restart: unless-stopped          # ← EKLE
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketplace    # ← DEĞİŞTİR (test → marketplace)
      MYSQL_USER: std
      MYSQL_PASSWORD: std
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ctis256project-phpmyadmin
    restart: unless-stopped          # ← EKLE
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data: